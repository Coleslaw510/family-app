name: Family App CI

on:
  push:
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q

  ipa:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned apps
        working-directory: ios
        run: |
          set -euo pipefail
          for APP_NAME in FamilyApp BudgetApp; do
            xcodebuild \
              -project FamilyApp.xcodeproj \
              -scheme "$APP_NAME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$PWD/build" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              build
          done
      - name: Package unsigned IPAs
        working-directory: ios
        run: |
          set -euo pipefail
          for APP_NAME in FamilyApp BudgetApp; do
            APP=$(find build -type d -name "${APP_NAME}.app" | head -n 1)
            test -n "$APP"
            test -f "$APP/Info.plist"
            rm -rf Payload
            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry "${APP_NAME}-unsigned.ipa" Payload
            unzip -t "${APP_NAME}-unsigned.ipa"
            ls -lh "${APP_NAME}-unsigned.ipa"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyApps-unsigned-ipas
          path: |
            ios/FamilyApp-unsigned.ipa
            ios/BudgetApp-unsigned.ipa
          if-no-files-found: error
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ios/FamilyApp-unsigned.ipa
            ios/BudgetApp-unsigned.ipa
          generate_release_notes: true
