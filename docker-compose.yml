services:
  app:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: "8000"
      DB_PATH: /data/family.db
      JOIN_CODE_TTL_HOURS: "24"
      JOIN_MAX_ATTEMPTS: "8"
      JOIN_WINDOW_SECONDS: "900"
      CREATE_MAX_ATTEMPTS: "8"
      CREATE_WINDOW_SECONDS: "3600"
      SESSION_DAYS: "400"
    volumes:
      - family-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  family-data:
  caddy-data:
  caddy-config:
