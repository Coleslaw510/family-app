name: FamilyApp
options:
  bundleIdPrefix: com.colemcclintock
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  FamilyApp:
    type: application
    platform: iOS
    sources:
      - path: FamilyApp
        excludes:
          - Info.plist
    dependencies:
      - sdk: SpriteKit.framework
      - sdk: Charts.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colemcclintock.familyapp
        PRODUCT_NAME: FamilyApp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FamilyApp/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": ""
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
schemes:
  FamilyApp:
    build:
      targets:
        FamilyApp: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
